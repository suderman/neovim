name: Update flake.lock

on:
  # Started on Sundays by suderman/nixos's update-flake-lock workflow.
  workflow_dispatch:

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v27

      - name: Update flake
        run: nix flake update

      - name: Commit and push if flake.lock changed
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Automated flake.lock update"
          git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
